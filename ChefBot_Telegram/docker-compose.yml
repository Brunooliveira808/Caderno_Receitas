services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chefbot-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DATABASE_URL=jdbc:postgresql://postgres:5432/chefbot
      - DATABASE_USERNAME=postgres
      - DATABASE_PASSWORD=postgres
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - JWT_SECRET=${JWT_SECRET:-chefbot_culinario_secret_super_segura_2026_jwt_token_key_123456}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: chefbot-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=chefbot
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - chefbot-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  chefbot-pgdata:
