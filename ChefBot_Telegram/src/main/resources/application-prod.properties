# Profile de Produção para Nuvem (Render, Railway, Docker)
spring.application.name=ChefBot_Telegram

# Porta HTTP (Render/Railway injetam a variável PORT)
server.port=${PORT:8080}

# Banco de Dados PostgreSQL
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/chefbot}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Telegram Bot (injetados via variáveis de ambiente da nuvem)
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}
telegram.bot.username=${TELEGRAM_BOT_USERNAME:ChefBot}

# Google Gemini API
gemini.api.key=${GEMINI_API_KEY:}
gemini.model.primary=${GEMINI_MODEL:gemini-3.1-flash-lite}

# JWT Secret e Expiração
jwt.secret=${JWT_SECRET:chefbot_culinario_secret_super_segura_2026_jwt_token_key_123456}
jwt.expiration-days=${JWT_EXPIRATION_DAYS:30}
